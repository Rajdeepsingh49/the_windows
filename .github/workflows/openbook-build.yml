name: Build & Test SEB Open-Book (Windows)

# Cloud build + test for the open-book fork. There is no way to build or run this
# Win32 / .NET Framework 4.8 / WPF application on macOS, so verification happens here:
#   1. compile the whole solution (the proven AppVeyor recipe),
#   2. run the complete MSTest unit-test suite,
#   3. build the Setup.msi installer and publish the x64 one as a downloadable release asset.
# Runs on every push.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: build-test (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install WiX Toolset v3 (safety; usually preinstalled)
        run: choco install wixtoolset -y --no-progress
        continue-on-error: true

      - name: NuGet restore
        run: nuget restore SafeExamBrowser.sln

      - name: Build solution (Release, ${{ matrix.platform }})
        run: msbuild SafeExamBrowser.sln /verbosity:minimal /property:langversion=latest /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Run unit tests (${{ matrix.platform }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $vstest = Join-Path $vs 'Common7\IDE\Extensions\TestPlatform\vstest.console.exe'
          if (-not (Test-Path $vstest)) { throw "vstest.console.exe not found at $vstest" }
          $dlls = Get-ChildItem -Recurse -Filter '*.UnitTests.dll' | Where-Object { $_.FullName -match 'bin\\${{ matrix.platform }}\\Release' } | Select-Object -ExpandProperty FullName
          if (-not $dlls) { throw "No unit-test assemblies found." }
          Write-Host "Running tests in:"; $dlls | ForEach-Object { Write-Host "  $_" }
          & $vstest $dlls /Platform:${{ matrix.platform }} /Logger:"trx;LogFileName=tests-${{ matrix.platform }}.trx" /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed." }

      - name: Upload test results (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Upload Setup.msi (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEB-OpenBook-${{ matrix.platform }}-Setup
          path: Setup/bin/${{ matrix.platform }}/Release/Setup.msi
          if-no-files-found: warn

      - name: Publish x64 installer to a GitHub Release (master only)
        if: matrix.platform == 'x64' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = "Setup/bin/x64/Release/Setup.msi"
          if (-not (Test-Path $msi)) { Write-Host "No MSI produced; skipping release."; exit 0 }
          gh release create openbook-latest-x64 --title "SEB Open-Book - latest x64 build" --notes "Automated build from commit ${{ github.sha }}. Testing build for open-book exams - not official SEB." 2>$null
          gh release upload openbook-latest-x64 "$msi" --clobber
          Write-Host "Published: https://github.com/${{ github.repository }}/releases/download/openbook-latest-x64/Setup.msi"
