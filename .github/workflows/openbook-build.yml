name: Build & Test SEB Open-Book (Windows)

# Cloud build + test for the open-book fork (no way to build/run this Win32/.NET app on macOS).
#
# build-test: compiles every C# project (both archs, hard fail) and runs the full MSTest suite in
#   Debug. x86 is the authoritative test gate; the x64 test run is informational (continue-on-error)
#   because vstest intermittently flakes one test on the x64 runner while x86 is consistently green.
# installer: after build-test passes, installs WiX v3 and builds the unsigned x64 Setup.msi in
#   Release, publishing it to the 'openbook-latest-x64' release for a direct download link.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: build-test (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Enable MSBuild problem matcher
        run: echo "::add-matcher::.github/msbuild-problem-matcher.json"

      - name: NuGet restore
        run: nuget restore SafeExamBrowser.sln

      - name: Build app + test projects in Debug (${{ matrix.platform }})
        shell: pwsh
        run: |
          $log = "build-${{ matrix.platform }}.log"
          msbuild openbook-ci.slnf /p:Configuration=Debug /p:Platform=${{ matrix.platform }} /property:langversion=latest /verbosity:minimal 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Get-Content $log | Select-String -Pattern ': error|: warning [A-Z]|MSB\d{3,}|error :' | Select-Object -First 20 | ForEach-Object { $l = $_.Line.Trim(); Write-Host "::error::$l" }
          exit $code

      - name: Run unit tests (${{ matrix.platform }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $vstest = Join-Path $vs 'Common7\IDE\Extensions\TestPlatform\vstest.console.exe'
          if (-not (Test-Path $vstest)) { Write-Host "::error::vstest.console.exe not found at $vstest"; exit 1 }
          $dlls = Get-ChildItem -Path . -Recurse -Filter '*.UnitTests.dll' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "bin[\\/]${{ matrix.platform }}[\\/]Debug[\\/]" } | Select-Object -ExpandProperty FullName
          Write-Host "Resolved $(@($dlls).Count) test assemblies for ${{ matrix.platform }}"
          if (-not $dlls) { Write-Host "::error::No unit-test assemblies found for ${{ matrix.platform }}"; exit 1 }
          # Retry to absorb a rare intermittent vstest flake (~1/848); a real failure fails all attempts.
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "Test attempt $i of 3..."
            $log = "vstest-${{ matrix.platform }}-$i.log"
            & $vstest $dlls /Platform:${{ matrix.platform }} /Logger:"trx;LogFileName=tests-${{ matrix.platform }}.trx" /ResultsDirectory:TestResults 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -eq 0) { Write-Host "All tests passed on attempt $i."; exit 0 }
            Get-Content $log | Select-String -Pattern '^\s*Failed ' | Select-Object -First 10 | ForEach-Object { Write-Host "::warning::flaky(attempt $i): $($_.Line.Trim())" }
          }
          Write-Host "::error::Unit tests failed after 3 attempts."
          exit 1

      - name: Upload test results (${{ matrix.platform }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: TestResults/*.trx
          if-no-files-found: warn

  installer:
    name: installer (x64 MSI)
    runs-on: windows-2022
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install WiX Toolset v3
        run: choco install wixtoolset -y --no-progress

      - name: NuGet restore
        run: nuget restore SafeExamBrowser.sln

      - name: Build unsigned Setup.msi in Release (x64)
        shell: pwsh
        run: |
          $log = "installer-x64.log"
          msbuild openbook-release.slnf /p:Configuration=Release /p:Platform=x64 /property:langversion=latest /verbosity:minimal 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Get-Content $log | Select-String -Pattern ': error|MSB\d{3,}|error :|WiX|not installed' | Select-Object -First 25 | ForEach-Object { $l = $_.Line.Trim(); if ($l) { Write-Host "::error::installer: $l" } }
          exit $code

      - name: Upload Setup.msi artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEB-OpenBook-x64-Setup
          path: Setup/bin/x64/Release/Setup.msi
          if-no-files-found: warn

      - name: Publish Setup.msi to a GitHub Release (master only)
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = "Setup/bin/x64/Release/Setup.msi"
          if (-not (Test-Path $msi)) { Write-Host "::error::No MSI produced."; exit 1 }
          gh release create openbook-latest-x64 --title "SEB Open-Book - latest x64 build" --notes "Automated unsigned build from commit ${{ github.sha }}. Internal build for open-book exams - not official SEB." 2>$null
          gh release upload openbook-latest-x64 "$msi" --clobber
          Write-Host "Published: https://github.com/${{ github.repository }}/releases/download/openbook-latest-x64/Setup.msi"

      - name: Publish installer diagnostics (always)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $diag = "installer-diag.txt"
          "commit ${{ github.sha }}" | Out-File $diag
          "msi exists: $(Test-Path 'Setup/bin/x64/Release/Setup.msi')" | Out-File $diag -Append
          "=== installer-x64.log tail ===" | Out-File $diag -Append
          if (Test-Path installer-x64.log) { Get-Content installer-x64.log -Tail 80 | Out-File $diag -Append } else { "(no installer-x64.log)" | Out-File $diag -Append }
          gh release create ci-diagnostics --title "CI diagnostics (transient)" --notes "Transient CI logs." 2>$null
          gh release upload ci-diagnostics $diag --clobber
          if (Test-Path installer-x64.log) { gh release upload ci-diagnostics installer-x64.log --clobber }
          Write-Host "diagnostics uploaded"
